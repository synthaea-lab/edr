events {
    worker_connections 1024;
}

http {
    # Map to inject proxy secret from environment
    # This allows Next.js to verify requests came through nginx
    map $request_uri $proxy_secret {
        default "${NGINX_PROXY_SECRET}";
    }

    # The cron endpoints are public (a scheduler calls them with a bearer) and a rejected bearer
    # may cost a database lookup (decoy credentials, issue #81): bound what one address can ask.
    limit_req_zone $binary_remote_addr zone=cron:1m rate=10r/s;
    limit_req_status 429;

    upstream server {
        server server:3000;
    }

    server {
        listen 8443 ssl;

        # Server cert
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Client cert verification (mTLS)
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;

        # Pass client cert info to backend
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        # The connection's address, replacing anything the client sent: what the control plane
        # records as the source of a decoy credential's use. X-Forwarded-For below keeps the
        # client's own entries first and appends this address last.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # SECURITY: Proxy authentication header
        # Prevents header spoofing when requests bypass nginx
        proxy_set_header X-Proxy-Secret $proxy_secret;

        location /api/ingest/ {
            # Require valid client cert for ingest endpoints
            if ($ssl_client_verify != "SUCCESS") {
                return 401;
            }

            # A spooled event batch can outgrow nginx's 1m default.
            client_max_body_size 8m;

            proxy_pass http://server;
        }

        location /api/v1/ingest/ {
            # The agent's versioned ingest paths: same client-cert requirement as
            # /api/ingest/. A spooled batch can outgrow nginx's 1m default.
            if ($ssl_client_verify != "SUCCESS") {
                return 401;
            }

            client_max_body_size 8m;
            proxy_pass http://server;
        }

        location ~ ^/api/(release/(manifest|artifact)|content/(manifest/[^/]+|artifact))$ {
            # Agent release and content download (issue #30): a valid client cert is required
            if ($ssl_client_verify != "SUCCESS") {
                return 401;
            }

            proxy_pass http://server;
        }

        location /api/cron/ {
            limit_req zone=cron burst=20 nodelay;
            proxy_pass http://server;
        }

        location / {
            proxy_pass http://server;
        }
    }
}
