title: Passworded archive of Windows user data
description: >
  Detects 7-Zip or RAR creating a password-protected archive from a Windows
  Documents or Desktop target. It observes command intent only; it does not prove
  that an archive was written or later transferred. Other archivers and paths
  outside these user-directory spellings are not covered.
tags:
  - attack.collection
  - attack.t1560.001
  - synthaea.coverage.collection_exfiltration
level: medium
falsepositives:
  - Developers packaging password-protected project backups and administrators
    creating encrypted user-data archives for approved migration or recovery.
detection:
  selection:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\rar.exe'
    CommandLine|contains: ' -p'
    CommandLine:
      - '*\Documents\*'
      - '*\Desktop\*'
  condition: selection
