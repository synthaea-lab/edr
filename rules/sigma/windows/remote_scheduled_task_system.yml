title: Remote scheduled task created to run as SYSTEM
description: >
  Detects schtasks requesting creation on an explicit remote host with SYSTEM
  as its run-as account, including commands with later /rp, /f or /rl options.
  The rule observes privileged remote task
  creation arguments, not whether the task was accepted or ran.
tags:
  - attack.persistence
  - attack.execution
  - attack.lateral_movement
  - attack.t1053.005
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Fleet administrators installing SYSTEM tasks remotely for software deployment,
    monitoring or incident response; lab automation can use the same command.
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create /s '
    CommandLine:
      - '* /ru SYSTEM'
      - '* /ru SYSTEM *'
      - '* /ru "SYSTEM"'
      - '* /ru "SYSTEM" *'
  condition: selection
