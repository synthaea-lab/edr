title: Net adds an account to the local Administrators group
description: >
  Detects net.exe or net1.exe requesting a member addition to the local
  built-in local administrators group using common European localized names.
  It does not confirm the account change succeeded; SID-based PowerShell and
  other account-management tools are outside this rule.
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - synthaea.coverage.privesc_impact
level: medium
falsepositives:
  - Help-desk staff and endpoint-management systems adding approved local
    administrators during provisioning or incident response.
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains:
      - ' localgroup administrators '
      - ' localgroup "administrators" '
      - ' localgroup administrateurs '
      - ' localgroup "administrateurs" '
      - ' localgroup administradores '
      - ' localgroup "administradores" '
      - ' localgroup administratoren '
      - ' localgroup "administratoren" '
      - ' localgroup amministratori '
      - ' localgroup "amministratori" '
    CommandLine: '* /add*'
  condition: selection
