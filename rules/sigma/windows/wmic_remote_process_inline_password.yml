title: WMIC remote process creation with an inline password
description: >
  Detects WMIC targeting a remote node with an inline password and requesting
  process creation, including launches using a quoted full executable path.
  The rule observes submitted commands, not authentication results or
  successful execution.
tags:
  - attack.execution
  - attack.lateral_movement
  - attack.t1047
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Legacy deployment, help-desk automation and authorized red-team scripts
    that create a remote process using a password on the command line.
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - ' /node:'
      - ' /password:'
      - ' process call create '
  condition: selection
