title: WMIC remote process creation with an inline password
description: >
  Detects a WMIC invocation beginning with a remote node, carrying an inline
  password and requesting process creation. The rule observes the submitted
  command, not its authentication result or successful execution.
tags:
  - attack.execution
  - attack.lateral_movement
  - attack.t1047
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Legacy deployment, help-desk automation and authorized red-team scripts
    that create a remote process using a password on the command line.
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|startswith:
      - 'wmic /node:'
      - 'wmic.exe /node:'
    CommandLine|contains: ' /password:'
    CommandLine: '* process call create *'
  condition: selection
