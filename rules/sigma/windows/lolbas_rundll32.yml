title: Rundll32 with suspicious argument
description: >
  Detects the use of rundll32.exe with arguments frequently used to execute
  arbitrary code (Living Off The Land Binary). T1218.011.
tags:
  - attack.defense_evasion
  - attack.t1218.011
level: high
falsepositives:
  - "A small number of legitimate installers pass javascript or vbscript URIs, or the listed shell32/url.dll exports, to rundll32; uncommon outside installer activity."
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - shell32.dll,ShellExec_RunDLL
      - url.dll,FileProtocolHandler
  condition: selection
