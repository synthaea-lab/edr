title: PsExec remote invocation with inline account credentials
description: >
  Detects PsExec with an explicit remote host, user and password arguments.
  This credential-bearing remote administration pattern is narrower than
  a tool-name alert; success and authorization are not visible in exec events.
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Administrators using separate service accounts for remote maintenance and
    deployment scripts on legacy hosts, plus authorized lateral-movement labs.
detection:
  selection:
    Image|endswith:
      - '\psexec.exe'
      - '\psexec64.exe'
    CommandLine|startswith:
      - 'psexec \\'
      - 'psexec.exe \\'
      - 'psexec64 \\'
      - 'psexec64.exe \\'
    CommandLine|contains: ' -p '
    CommandLine: '* -u *'
  condition: selection
