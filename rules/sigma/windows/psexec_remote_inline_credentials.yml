title: PsExec remote invocation with an inline password
description: >
  Detects PsExec with an explicit remote host and inline password, including
  a quoted full executable path and reordered arguments. A separate username
  argument is not required. Success and authorization are not visible in exec
  events.
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Administrators using inline passwords for remote maintenance or deployment
    scripts on legacy hosts, plus authorized lateral-movement labs.
detection:
  selection:
    Image|endswith:
      - '\psexec.exe'
      - '\psexec64.exe'
    CommandLine: '* \\*'
    CommandLine|contains: ' -p '
  condition: selection
