title: Registry credential hives saved to files
description: >
  Detects reg.exe saving the SAM, SECURITY or SYSTEM hive to a file. These
  exports expose password hashes or the material used to decrypt them; the
  command alone does not prove subsequent extraction or unauthorized access.
tags:
  - attack.credential_access
  - attack.t1003.002
  - attack.t1003.004
  - synthaea.coverage.credential_access
level: medium
falsepositives:
  - Administrators exporting registry hives for recovery, forensic acquisition
    or an approved offline security audit.
detection:
  selection:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
      - ' save hklm\sam '
      - ' save hklm\security '
      - ' save hklm\system '
      - ' save "hklm\sam" '
      - ' save "hklm\security" '
      - ' save "hklm\system" '
  condition: selection
