title: Remote service created with a command-shell binary path
description: >
  Detects sc.exe creating a remote service whose binary path invokes cmd,
  PowerShell or %COMSPEC%, including a quoted full sc.exe path. The rule
  observes submitted commands, not whether the service starts or execution
  succeeds. Other shell launchers are outside this rule.
tags:
  - attack.persistence
  - attack.lateral_movement
  - attack.t1543.003
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Authorized local or remote remediation through temporary shell services,
    controlled red-team exercises and legacy deployment wrappers.
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
      - ' create '
      - '\\'
      - 'binPath='
    CommandLine|contains:
      - 'cmd.exe /c'
      - 'cmd.exe /k'
      - 'powershell.exe'
      - '%comspec%'
  condition: selection
