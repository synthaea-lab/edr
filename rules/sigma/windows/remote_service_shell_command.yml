title: Remote service created with a command-shell binary path
description: >
  Detects sc.exe creating a service on another host (a `\` argument, normally the
  `\host` target) whose binary path invokes cmd, PowerShell or %COMSPEC%, including
  a quoted full sc.exe path. The `\` test is positional-free, so a local create whose
  binary path itself contains a UNC path also matches. The local form of the same
  persistence is covered by `service_created_with_shell_binpath`, so a remote create
  raises both. The rule observes submitted commands, not whether the service starts
  or execution succeeds. Other shell launchers are outside this rule.
tags:
  - attack.persistence
  - attack.lateral_movement
  - attack.t1543.003
  - synthaea.coverage.discovery_lateral
level: medium
falsepositives:
  - Authorized local or remote remediation through temporary shell services,
    controlled red-team exercises and legacy deployment wrappers.
detection:
  selection:
    Image|endswith: '\sc.exe'
    CommandLine|contains|all:
      - ' create '
      - '\\'
      - 'binPath='
    CommandLine|contains:
      - 'cmd.exe /c'
      - 'cmd.exe /k'
      - 'powershell.exe'
      - '%comspec%'
  condition: selection
