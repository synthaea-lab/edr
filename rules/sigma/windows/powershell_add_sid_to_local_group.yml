title: PowerShell adds a member to a local group by SID
description: >
  Detects Add-LocalGroupMember targeting the built-in Administrators group by
  its well-known SID. It records command intent only; it does not confirm the
  membership change succeeded. Name-based additions are covered by a separate
  net.exe rule when localized group names are used.
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
  - synthaea.coverage.privesc_impact
level: medium
falsepositives:
  - Administrators using PowerShell to add an approved account to the built-in
    local Administrators group.
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains: '-SID S-1-5-32-544'
    CommandLine: '*Add-LocalGroupMember*'
  condition: selection
