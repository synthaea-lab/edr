title: Web server spawned a shell on macOS
description: >
  Detects Apache (`httpd`), nginx or PHP-FPM directly starting a shell on macOS: a
  process-lineage signal for a possible exploit of a public-facing application (T1190), the
  macOS sibling of the Linux service-lineage rule. It needs the parent image the Endpoint
  Security exec event carries; without lineage the rule does not match. It does not claim
  that the process pair alone proves exploitation. Apache ships with macOS but is off by
  default; nginx and PHP come from a package manager, so the common case is a development
  machine.
  The engine loads every platform's content on every host, so the rule also matches the
  same lineage on Linux, beside the service-lineage rule of the rule engine (T1059).
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - synthaea.coverage.initial_access_user_execution
level: medium
falsepositives:
  - A CGI script or a deployment hook that deliberately calls a shell, most likely on a
    development machine running a local Apache, nginx or PHP-FPM.
detection:
  selection:
    ParentImage|endswith:
      - '/httpd'
      - '/nginx'
      - '/php-fpm'
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/zsh'
      - '/dash'
  condition: selection
