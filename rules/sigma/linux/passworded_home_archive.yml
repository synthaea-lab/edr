title: Passworded archive of Linux home data
description: >
  Detects 7-Zip or RAR creating a password-protected archive from an absolute
  home or root path. It observes command intent only; it does not prove that an
  archive was written or later transferred. Other archivers and relative paths
  are not covered.
tags:
  - attack.collection
  - attack.t1560.001
  - synthaea.coverage.collection_exfiltration
level: medium
falsepositives:
  - Developers creating encrypted home-directory backups and administrators
    preparing approved account migrations or recovery archives.
detection:
  selection:
    Image|endswith:
      - '/7z'
      - '/7za'
      - '/rar'
    CommandLine|contains: ' -p'
    CommandLine:
      - '*/home/*'
      - '*/root/*'
  condition: selection
