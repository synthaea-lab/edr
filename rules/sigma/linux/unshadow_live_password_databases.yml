title: Unshadow combines live account and password databases
description: >
  Detects unshadow receiving the live /etc/passwd and /etc/shadow pair, a
  specific preparation step for offline password cracking. Additional options
  after the live database pair are allowed; reversed paths and fixture files
  remain outside this narrow rule. Linux argv telemetry removes shell quotes.
tags:
  - attack.credential_access
  - attack.t1003.008
  - synthaea.coverage.credential_access
level: medium
falsepositives:
  - Authorized password-strength assessments using the host's actual account
    databases, including administrator-run lab exercises.
detection:
  selection:
    Image|endswith: '/unshadow'
    CommandLine|contains: ' /etc/passwd /etc/shadow'
  condition: selection
