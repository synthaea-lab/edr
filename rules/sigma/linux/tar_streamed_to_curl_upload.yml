title: Tar streams home data into a curl upload
description: >
  Detects a shell command that streams an archive of /home or /root into a
  curl stdin upload. This is a command-line intent signal; it does not confirm
  file reads, bytes sent, or a successful network transfer. Other archive
  options, paths, shells and upload clients are outside this rule.
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1560.001
  - attack.t1041
  - synthaea.coverage.collection_exfiltration
level: medium
falsepositives:
  - Developers and administrators streaming approved home-directory backups
    to an artifact or recovery service.
detection:
  selection:
    Image|endswith:
      - '/bash'
      - '/sh'
    CommandLine|contains:
      - 'tar -cf - /home/'
      - 'tar -czf - /home/'
      - 'tar -cf - /root/'
      - 'tar -czf - /root/'
    CommandLine:
      - '*| curl -T -*'
      - '*| curl --upload-file -*'
  condition: selection
