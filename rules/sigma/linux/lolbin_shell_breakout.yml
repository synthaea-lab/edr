title: GTFOBins - system binary used to spawn a shell
description: >
  Detects legitimate binaries (find, python, vim/less/more...) being used to break out
  into an interactive shell — the Linux equivalent of LOLBAS/rundll32 on Windows. A
  classic technique for bypassing shell restrictions (GTFOBins). T1059.004 / T1548.
tags:
  - attack.defense_evasion
  - attack.t1059.004
  - attack.privilege_escalation
  - attack.t1548
level: high
falsepositives:
  - An admin interactively using a GTFOBins-style breakout for legitimate shell
    access on a restricted system; uncommon in normal server operation.
detection:
  selection:
    CommandLine|contains:
      - '-exec /bin/sh'
      - '-exec /bin/bash'
      - 'pty.spawn("/bin/sh")'
      - 'pty.spawn("/bin/bash")'
      - "pty.spawn('/bin/sh')"
      - "pty.spawn('/bin/bash')"
      - '!/bin/sh'
      - '!/bin/bash'
  condition: selection
