name: ML

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:

# Read-only token for every job: nothing here writes to the repo, and a
# compromised step or dependency then can't push, tag or touch PRs.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest
      - name: ruff
        run: ruff check ml
      - name: pytest
        # The dev extra carries numpy/onnx so the Rust/Python attribution parity
        # tests really run here (they importorskip otherwise, silently weakening
        # the seam).
        run: |
          pip install -e "ml[dev]"
          pytest ml/tests
