name: Content

on:
  push:
    branches: [main]
    paths: ["rules/**", "crates/sigma/**", "crates/yara/**", ".github/workflows/content.yml"]
  pull_request:
    paths: ["rules/**", "crates/sigma/**", "crates/yara/**", ".github/workflows/content.yml"]
  workflow_dispatch:

# Read-only token for every job: nothing here writes to the repo, and a
# compromised step or dependency then can't push, tag or touch PRs.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each engine's content suite loads its whole rules/ tree through the real
      # engine: every shipped rule must compile/validate AND fire on its crafted
      # matching sample (crates/{sigma,yara}/tests/content.rs).
      - name: sigma content suite
        run: cargo test -p sigma --test content
      - name: yara content suite
        run: cargo test -p yara --test content
