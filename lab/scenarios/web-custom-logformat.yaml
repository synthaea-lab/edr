name: web-custom-logformat
platform: linux
script: web-custom-logformat.sh
simulates: >
  A site whose Apache LogFormat is not the combined format, read by an `access_combined`
  source (issue #478 level 2, ADR-0022). Not an attack: the case where detection would
  otherwise go blind without saying so.
expected_detections:
  - technique: "LOG-SOURCE"
    rule: misparse watch   # agent/src/log_sources.rs, MisparseWatch (crates/sensors/linux/logs)
    min_count: 1
    tolerance: 0
notes: >
  Needs Apache with a second vhost on port 8081 writing a custom-format log, and an
  `access_combined` source on that file. At least 10 lines in a 60 s window, half of them
  rejected, are needed for a verdict; the script sends 20 and waits out the window.
  Validated 2026-10-07 on Debian 13 (6.12.107), Apache 2.4: `LOG-SOURCE log source
  /var/log/apache2/custom-format.log (AccessCombined): 21 of 21 lines in the last minute do not
  match the declared kind`.
  Validated 2026-10-15 on Fedora 43 (kernel 7.2.9, SELinux Enforcing, 0 AVC denials over the session), httpd 2.4.68: `LOG-SOURCE ... 22 of 22 lines in the last minute
  do not match the declared kind`. SELinux does not let httpd listen on 8081 (not in
  `http_port_t`; `Listen 8081` fails with `make_sock: could not bind`), so use a port the policy
  allows, such as 8008, and pass it: `web-custom-logformat.sh http://127.0.0.1:8008`. The log goes
  to /var/log/httpd/custom-format.log.
  Validated 2026-10-15 on Rocky Linux 9.8 (kernel 5.14.0-687, glibc 2.34, SELinux Enforcing, 0 AVC denials over the session), httpd 2.4.62, agent built static (musl) from main: `LOG-SOURCE ... 21 of 21 lines in the last
  minute do not match the declared kind` (vhost on 8008, same reason as on Fedora).
