name: mysql-failed-login
platform: linux
script: mysql-failed-login.sh
simulates: >
  A burst of failed logins against a local MariaDB/MySQL server (T1110, Brute Force),
  read from the server's error log by a `mysql_error` source (issue #478 level 2,
  ADR-0022). The scenario uses a made-up account name and a deliberately wrong
  password; no data and no real account is touched.
expected_detections:
  - technique: "T1110"
    rule: on_auth   # crates/rules/src/state.rs — AUTH_FAILURE_THRESHOLD in
                    # AUTH_FAILURE_WINDOW_NS, per (target user, source)
    min_count: 1
    tolerance: 0
notes: >
  Needs a real server whose error log is a file (Ubuntu/Debian MariaDB logs to the
  journal by default) and a `[[logs.sources]]` entry for it. Validated on MariaDB
  10.11.14, Ubuntu 24.04, with the real agent: the burst alerts, a logrotate-style
  rename + `flush logs` is followed (rotations=1), and failures written while the
  agent was down are read after a restart without replaying earlier ones. MySQL 8.0.46
  (Ubuntu 24.04) was run the same way against the parser: both message ids
  (MY-010925 without the password clause, MY-010926 with it), a user name containing a
  quote and `'@'`, all parsed. MySQL 8 writes these lines only at
  `log_error_verbosity = 3`; its default of 2 writes none, so a source left at the
  default stays silent. Run end to end with the agent on 2026-10-15 on Fedora 43 (kernel 7.2.9,
  SELinux Enforcing, 0 AVC denials) against MySQL 8.4.10 with `log_error_verbosity = 3` and
  `log_error = /var/log/mysql/error.log` (Fedora's own mysql-server.cnf sets another log_error:
  load the override after it, e.g. zz-*.cnf): six failed logins raise T1110 `target=edr_lab_victim
  source=local: 5 failed authentications in 60s`. A client logged with an IP is keyed by it: with
  `skip_name_resolve = ON` and an account bound to 127.0.0.1, the same burst raises T1110
  `source=127.0.0.1`. Without a matching account such a client gets ERROR 1130 (host not allowed),
  which is not logged as an Access denied line. Rocky Linux 9.8 (kernel 5.14, SELinux Enforcing, 0 AVC) with
  MySQL 8.0.45 the same day: T1110 `source=local`, and with `skip_name_resolve` plus an account bound to
  127.0.0.1, `source=127.0.0.1`.
