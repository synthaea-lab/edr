name: web-webshell-php
platform: linux
script: web-webshell-php.sh
simulates: >
  A real PHP web shell on Apache + PHP-FPM (T1505.003, Server Software Component: Web
  Shell). The script writes a one-line PHP file under the web root, requests it with a
  command, and PHP-FPM spawns a real shell; the request is read from Apache's access log
  by an `access_combined` source (issue #478 level 2, ADR-0022). The file is removed
  when the script ends. Lab VM only.
expected_detections:
  - technique: "T1505.003"
    rule: rule_web_request_shell   # crates/correlator/src/rules.rs
    min_count: 1
    tolerance: 0
  - technique: "T1059"
    rule: check_web_server_spawns_shell   # crates/rules/src/state.rs, parent php-fpm*
    min_count: 1
    tolerance: 0
notes: >
  Needs Apache with PHP-FPM actually executing PHP (the script checks the answer and
  fails if the server returns nothing), root, and a `[[logs.sources]]` entry of kind
  `access_combined` for /var/log/apache2/access.log.
  Validated 2026-10-07 on Debian 13 (6.12.107), Apache 2.4 + PHP-FPM 8.4, real agent run as root:
  T1505.003 names the request (GET /uploads/c99.php param=cmd, status 200, 0 s), T1059 reports
  `executed directly by ... php-fpm8.4 (service)`. Seen once in a longer run that sent other
  signature requests first: the alert paired the shell with an earlier 404 request 11 s away
  instead of this one, which the log line (written after the response) reaches the agent just
  after the shell. Not reproduced when the scenario runs alone. Fixed by #807 (merged 2026-10-14): a shell
  is paired only with a request read from its time through 3 s after it, so an earlier 404 can no
  longer be named; see the #807 re-run below.
  Validated 2026-10-15 on Fedora 43 (kernel 7.2.9, SELinux Enforcing, 0 AVC denials over the session), httpd 2.4.68 + PHP-FPM 8.4.26 (workers run as `apache`, the
  shell answers as `httpd_t`; agent `665dc8d`, #820, with inline-fix.diff, before #807), access log /var/log/httpd/access_log: T1505.003 names the request
  (GET /uploads/c99.php param=cmd, status 200, 0 s), T1059 reports `executed directly by ...
  php-fpm (service)`. No change to the stock SELinux policy was needed.
  Validated 2026-10-15 on Rocky Linux 9.8 (kernel 5.14.0-687, glibc 2.34, SELinux Enforcing, 0 AVC denials over the session), httpd 2.4.62, agent built static (musl) from main `b28935b` plus #845's diff, php-fpm 8.0.30 (workers as `apache`, httpd_t),
  access log /var/log/httpd/access_log: T1505.003 names the request (GET /uploads/c99.php param=cmd,
  status 200, 0 s), T1059 reports `executed directly by ... php-fpm (service)`.
  The #807 lab re-run (this scenario run after other signature requests, here after
  web-webshell.sh) on Fedora 43 and on Rocky 9.8, agent of main (`b28935b` plus #845, the static build; no
  separate Fedora hash was kept): the alert names the status-200 request
  (0 s) on both, not an earlier 404.
  Not a scenario, a manual run on Fedora 43 (2026-10-15): a web server in a container. Rootful podman
  5.8.8, agent `665dc8d` (#820, with inline-fix.diff: a build from before #807), image docker.io/library/php:8.4-apache, port 8090, /var/www/html and /var/log/apache2 bind-mounted
  from the host (with `CustomLog /var/log/apache2/access.log combined`), `access_combined` source on the
  mounted log, the same one-line PHP shell. T1059 `executed directly by ppid=... comm=apache2 (service)` and
  T1505.003 `0s from a WebshellLike request (GET /uploads/c99.php param=cmd, status 200, client
  10.88.0.1)` fire (the client is the podman bridge, not 127.0.0.1). That wording is the one of the
  `665dc8d` build; since #807 main words the same alert `<delta>s after a WebshellLike request`
  (crates/correlator/src/rules.rs), so the quote is not what a current agent prints; the container
  case was not re-run with one. The missing attribution is tracked as #894. The exec event carries no container
  attribution: the container's cgroup is `machine.slice/libpod-<id>.scope/container`, and the id extraction
  in crates/sensors/linux/userspace/src/container.rs (where the exec events are attributed, sensor.rs:325;
  the uprobes copy has the same logic) only knows `docker-<id>.scope` and `cri-containerd-<id>.scope`.
