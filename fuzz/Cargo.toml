[package]
name = "synthaea-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Excluded from the workspace like sensor-linux-ebpf: cargo-fuzz needs nightly,
# libFuzzer instrumentation, and its own profile settings — run it explicitly
# with `cargo +nightly fuzz run <target>` from this directory's parent.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sensor-linux-audit = { path = "../crates/sensors/linux/audit" }
sensor-linux-logs = { path = "../crates/sensors/linux/logs" }
sensor-linux-netlink = { path = "../crates/sensors/linux/netlink" }

[[bin]]
name = "audit_parse"
path = "fuzz_targets/audit_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netlink_parse"
path = "fuzz_targets/netlink_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logs_parse"
path = "fuzz_targets/logs_parse.rs"
test = false
doc = false
bench = false
