[package]
name = "agent"
version = "0.1.0"
description = "The Synthaea agent binary — wires sensors, detection, and response together"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../crates/schema" }
config = { path = "../crates/config" }
policy = { path = "../crates/policy" }
rules = { path = "../crates/rules" }
correlator = { path = "../crates/correlator" }
verdict = { path = "../crates/verdict" }
ml = { path = "../crates/ml" }
sigma = { path = "../crates/sigma" }
enrich = { path = "../crates/enrich" }
yara = { path = "../crates/yara" }
sinks = { path = "../crates/sinks" }
tamper = { path = "../crates/tamper" }
response = { path = "../crates/response" }
store = { path = "../crates/store" }
transport = { path = "../crates/transport" }
# Content-manifest fetch/verify (ADR-0016, issue #30/#73): cross-platform, unlike
# `updater::layout`'s Linux-only bootstrap/current/versions binary-update layout —
# content distribution has no such constraint, so this sits in the main
# dependency block, not the Linux-only one.
updater = { path = "../crates/updater" }
# Local control channel served to `cli` (issue #388). The agent is otherwise
# thread-based: tokio only runs the IPC server, on its own dedicated thread.
ipc = { path = "../crates/ipc" }
tokio = { workspace = true }

anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
# fmt + env-filter: RUST_LOG-style filtering; the default "tracing-log" feature
# bridges `log` records (aya-log, dependencies) into the subscriber.
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
sensor-windows = { path = "../crates/sensors/windows/etw" }
sensor-windows-eventlog = { path = "../crates/sensors/windows/eventlog" }
sensor-windows-sockets = { path = "../crates/sensors/windows/sockets" }
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
sensor-macos = { path = "../crates/sensors/macos/endpoint-security" }
sensor-macos-unifiedlog = { path = "../crates/sensors/macos/unifiedlog" }
sensor-macos-network-extension = { path = "../crates/sensors/macos/network-extension" }
sensor-macos-sockets = { path = "../crates/sensors/macos/sockets" }
ctrlc = "3"

[target.'cfg(target_os = "linux")'.dependencies]
sensor-linux = { path = "../crates/sensors/linux/userspace" }
sensor-linux-audit = { path = "../crates/sensors/linux/audit" }
sensor-linux-netlink = { path = "../crates/sensors/linux/netlink" }
sensor-linux-journal = { path = "../crates/sensors/linux/journal" }
sensor-linux-logs = { path = "../crates/sensors/linux/logs" }
sensor-linux-procmem = { path = "../crates/sensors/linux/procmem" }
sensor-linux-uprobes = { path = "../crates/sensors/linux/uprobes" }
# Observation-only file_open hook (issue #91/#313): cmd_run attaches it
# best-effort alongside the primary sensor. Inline blocking (-EPERM on a
# verdict) still needs the verdict model from #131/#133 first.
sensor-linux-lsm = { path = "../crates/sensors/linux/lsm" }
# Named directly in `commands::linux::attach_lsm_hooks`'s return type (the
# `Ebpf` object that must outlive the hook) — same version sensor-linux-lsm
# itself uses.
aya = { version = "0.14", default-features = false }
libc = "0.2"

[dev-dependencies]
schema = { path = "../crates/schema", features = ["test-fixtures"] }
