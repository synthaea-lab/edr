[package]
name = "sensor-linux-uprobes"
version = "0.1.0"
description = "Linux uprobe telemetry: TLS plaintext taps, shell readline"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sensor-linux-wire = { path = "../wire", features = ["user"] }
aya = { version = "0.14", default-features = false }
aya-log = { version = "0.3", default-features = false }
goblin = { version = "0.10", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["sync", "signal", "macros", "rt", "net", "time", "io-util"] }
libc = "0.2"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Docker socket container-attribution lookup (`docker.rs`, issue #312).
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
anyhow = "1.0"
aya-build = "0.2"
which = { version = "8.0.6", default-features = false }

[dev-dependencies]
proptest = "1.11"
