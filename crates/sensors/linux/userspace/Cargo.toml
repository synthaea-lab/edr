[package]
name = "sensor-linux"
version = "0.1.0"
description = "Linux sensor: loads the eBPF probes, drains ring buffers, normalizes into schema events"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
sensor-linux-wire = { path = "../wire", features = ["user"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", default-features = false }
aya-log = { version = "0.3", default-features = false }
libc = { version = "0.2", default-features = false }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
    "io-util",
] }

[dev-dependencies]
schema = { path = "../../../schema", features = ["test-fixtures"] }

[build-dependencies]
anyhow = "1"
aya-build = { version = "0.2.0", default-features = false }
which = { version = "8.0.6", default-features = false }
