[package]
name = "updater"
version = "0.1.0"
description = "Agent self-update and content/model distribution client"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The public test key set (ADR-0027). On by default so development and the lab keep working;
# a packaged build turns it off and then embeds only what `keys/*.pub` holds.
default = ["test-key"]
test-key = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11"
ring = "0.17"

# The descriptor-relative ownership walk in `layout` (Linux-only, like `layout` itself).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "stage_demo_release"
required-features = ["test-key"]
