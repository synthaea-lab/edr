[package]
name = "transport"
version = "0.1.0"
description = "Agent to control-plane communication"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates (base tier only - transport is a leaf crate)
schema.path = "../schema"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client (TLS via rustls is default in v3)
ureq = { version = "3", features = ["json"] }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schema = { path = "../schema", features = ["test-fixtures"] }
