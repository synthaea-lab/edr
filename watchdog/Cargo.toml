[package]
name = "watchdog"
version = "0.1.0"
description = "Watchdog: installs and supervises the agent as a system service (systemd / Windows SCM / launchd)"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
config = { path = "../crates/config" }
sha2 = "0.11"
# Post-promotion health gate (ADR-0015 Decision 6, issue #30): the watchdog rolls a
# release that never proves itself back, via the updater's layout + ban list.
updater = { path = "../crates/updater", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
# geteuid in tamper's root-only test gates; chown lives in std.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "synthaea-agent"
# `[workspace.metadata.deb]` does not propagate here — cargo-deb reads each crate's
# own `[package.metadata.deb]`, and arbitrary tool tables never participate in
# Cargo's own workspace-inheritance machinery. Set explicitly (#675: `dpkg` warned
# "missing 'Maintainer' field" without this).
maintainer = "Synthaea Security <security@synthaea.io>"
maintainer-scripts = "../packaging/linux/debian/maintainer-scripts"

# Assets: binaries use cargo-deb's target/release/ prefix, which it rewrites for
# --target and workspaces; other paths are relative to watchdog/.
assets = [
    # Bootstrap binaries
    ["target/release/watchdog", "var/lib/synthaea/bootstrap/", "755"],
    ["target/release/agent", "var/lib/synthaea/bootstrap/", "755"],
    ["target/release/cli", "var/lib/synthaea/bootstrap/", "755"],

    # systemd integration
    ["../packaging/linux/systemd/synthaea-agent.service", "usr/lib/systemd/system/", "644"],
    ["../packaging/linux/systemd/synthaea.sysusers", "usr/lib/sysusers.d/synthaea.conf", "644"],
    ["../packaging/linux/systemd/synthaea.tmpfiles", "usr/lib/tmpfiles.d/synthaea.conf", "644"],

    # Config (ADR-0013): the agent fails fast without a valid agent.toml, so the
    # package ships the same template `cli config init` writes, not a placeholder
    # (#675). Every control-plane field is a `# CHANGE ME` the operator must fill
    # in, but `offline_fallback = true` lets the agent start and run on it as-is.
    ["../crates/config/data/default-agent.toml", "etc/synthaea/agent.toml", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "synthaea-agent"
enable = true
start = true
