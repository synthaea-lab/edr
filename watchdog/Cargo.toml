[package]
name = "watchdog"
version = "0.1.0"
description = "Watchdog: installs and supervises the agent as a system service (systemd / Windows SCM / launchd)"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
config = { path = "../crates/config" }
sha2 = "0.11"
# Post-promotion health gate (ADR-0015 Decision 6, issue #30): the watchdog rolls a
# release that never proves itself back, via the updater's layout + ban list.
updater = { path = "../crates/updater" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"
# geteuid in tamper's root-only test gates; chown lives in std.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "synthaea-agent"
maintainer-scripts = "../packaging/linux/debian/maintainer-scripts"

# Assets: binaries, configs, systemd units (paths relative to watchdog/ directory)
assets = [
    # Bootstrap binaries
    ["../target/release/watchdog", "var/lib/synthaea/bootstrap/", "755"],
    ["../target/release/agent", "var/lib/synthaea/bootstrap/", "755"],
    ["../target/release/cli", "var/lib/synthaea/bootstrap/", "755"],

    # systemd integration
    ["../packaging/linux/systemd/synthaea-agent.service", "usr/lib/systemd/system/", "644"],
    ["../packaging/linux/systemd/synthaea.sysusers", "usr/lib/sysusers.d/synthaea.conf", "644"],
    ["../packaging/linux/systemd/synthaea.tmpfiles", "usr/lib/tmpfiles.d/synthaea.conf", "644"],

    # Config template
    ["../packaging/linux/debian/agent.conf.template", "etc/synthaea/agent.conf", "644"],
]

[package.metadata.deb.systemd-units]
unit-name = "synthaea-agent"
enable = true
start = true
